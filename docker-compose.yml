services:
  web:
    image: nginx:1.27-alpine
    container_name: web-tools
    ports:
      - "8081:80"
      - "8443:8443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/machine-tool-info-osaka:/usr/share/nginx/html/ampere/data:ro   # 収集サーバーの書き込み先を read-only 配信
      - /opt/machine-tool-info-yao:/usr/share/nginx/html/rs232/yao/data:ro   # 八尾拠点のRS-232Cイベント収集先を read-only 配信
      - ./nginx/stock.conf:/etc/nginx/conf.d/stock.conf:ro       # 在庫管理用設定を ro 配信
      - /opt/certs/stock:/etc/nginx/certs:ro # SSL 証明書を ro 配信
    restart: unless-stopped
    networks:                                                    # 既存ネットワーク + 在庫管理用ネットワーク
      - default
      - champion-admin-stock

networks:                                                        # 在庫管理用ネットワーク
  champion-admin-stock:
    name: champion-admin-stock_default
    external: true