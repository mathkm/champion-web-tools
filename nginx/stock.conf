# 在庫管理システム（champion-admin-stock）への転送。
# 既存の静的サイトとはポートを分け、HTTPS で受ける。
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/stock.crt;
    ssl_certificate_key /etc/nginx/certs/stock.key;

    # 写真は1枚5MB、CSV取込は4MBまで。nginx の既定の1MBでは弾かれる。
    client_max_body_size 8m;

    allow 192.168.0.0/16;
    deny  all;

    location / {
        # 転送先の名前を要求のたびに引き直す。
        # アプリが止まっていても nginx が起動でき、作り直してアドレスが変わっても追従する。
        resolver 127.0.0.11 valid=10s;
        set $stock_app http://champion-admin-stock-app-1:8080;
        proxy_pass $stock_app;

        proxy_set_header Host $host;
        # 追記ではなく上書き。監査ログの接続元を偽れないようにする。
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}